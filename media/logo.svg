<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#2a2418"/>
      <stop offset="1" stop-color="#0b0b10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.45" stop-color="#ffd100"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.6" stop-color="#ffd100" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="214" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="168" fill="#121218" stroke="url(#gold)" stroke-width="30"/>
  <!-- compass ticks: the guide points the way -->
  <g fill="#ffd100" opacity="0.9">
    <path d="M256 60 l18 34 h-36 z"/>
    <path d="M256 452 l-12 -24 h24 z" opacity="0.55"/>
    <path d="M60 256 l24 -12 v24 z" opacity="0.55"/>
    <path d="M452 256 l-24 12 v-24 z" opacity="0.55"/>
  </g>
  <!-- the quest mark -->
  <path d="M226 150 h60 l-10 150 h-40 z" fill="url(#gold)" stroke="#5a3d00" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="256" cy="348" r="28" fill="url(#gold)" stroke="#5a3d00" stroke-width="6"/>
</svg>
