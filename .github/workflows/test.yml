name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lua 5.1 syntax check and tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          for f in *.lua tools/QuestTriageShots/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests.lua
      - name: Release script syntax
        run: bash -n tools/release.sh && sh -n tools/screenshots.sh && sh -n tools/curseforge-description.sh
      - name: CurseForge description matches the README
        run: |
          sh tools/curseforge-description.sh --update
          git diff --exit-code CURSEFORGE-DESCRIPTION.md || { echo "::error::README.md changed: run sh tools/curseforge-description.sh --update"; exit 1; }
